# Enhanced Azure DevOps CI/CD Pipeline for Azure Chat Application
# Comprehensive pipeline with all documented features and integrations

name: '$(Date:yyyyMMdd)$(Rev:.r)'

trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    exclude:
      - README.md
      - docs/**
      - '*.md'

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - '*.md'

variables:
  # Build Configuration (Updated to Node.js 22 per docs)
  - name: nodeVersion
    value: '22.x'
  - name: buildConfiguration
    value: 'production'
  - name: vmImageName
    value: 'ubuntu-latest'
  
  # Application Settings
  - name: workingDirectory
    value: 'src'
  - name: artifactName
    value: 'azurechat-app'
  
  # Infrastructure Settings
  - name: infraDirectory
    value: 'infra'
  - name: scriptsDirectory
    value: 'scripts'
  - name: azureServiceConnectionDev
    value: 'azure-connection-dev'
  - name: azureServiceConnectionProd
    value: 'azure-connection-prod'
  
  # Feature Flags
  - name: enableDatadogMonitoring
    value: 'true'
  - name: enablePrivateEndpoints
    value: 'false'  # Dev default
  - name: enableManagedIdentities
    value: 'true'

# Pipeline Stages
stages:
# ==================================================
# CONTINUOUS INTEGRATION STAGE
# ==================================================
- stage: CI
  displayName: 'Continuous Integration'
  variables:
    - group: 'azurechat-shared'
  jobs:
  
  # Enhanced Code Quality and Security Analysis
  - job: CodeAnalysis
    displayName: 'Code Quality & Security Analysis'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js $(nodeVersion)'
      inputs:
        versionSpec: $(nodeVersion)
    
    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | $(workingDirectory)/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(workingDirectory)/node_modules
    
    - script: |
        cd $(workingDirectory)
        npm ci
      displayName: 'Install dependencies'
    
    - script: |
        cd $(workingDirectory)
        npm run lint
      displayName: 'Run ESLint'
      continueOnError: false
    
    # TypeScript compilation check with strict mode
    - script: |
        cd $(workingDirectory)
        npx tsc --noEmit --strict
      displayName: 'TypeScript strict compilation check'
    
    # Enhanced security vulnerability scanning
    - script: |
        cd $(workingDirectory)
        npm audit --audit-level moderate
        # Check for specific vulnerabilities in Azure Chat dependencies
        npm audit --json > audit-results.json
        echo "Checking for known vulnerabilities in Next.js, OpenAI SDK, and Azure SDKs..."
      displayName: 'Enhanced NPM security audit'
      continueOnError: false
    
    # Validate environment configuration
    - script: |
        echo "Validating environment configuration templates..."
        # Check that .env.example has all required variables per docs/8-environment-variables.md
        cd $(workingDirectory)
        if [ ! -f ".env.example" ]; then
          echo "ERROR: .env.example file not found"
          exit 1
        fi
        
        # Validate required environment variables are documented
        required_vars=(
          "AZURE_OPENAI_API_KEY" "AZURE_OPENAI_API_INSTANCE_NAME" 
          "AZURE_OPENAI_DALLE_API_KEY" "AZURE_COSMOSDB_URI" 
          "NEXTAUTH_SECRET" "ADMIN_EMAIL_ADDRESS"
        )
        
        for var in "${required_vars[@]}"; do
          if ! grep -q "$var" .env.example; then
            echo "WARNING: Required variable $var not found in .env.example"
          fi
        done
      displayName: 'Validate environment configuration'

  # Build and Test with Enhanced Validation
  - job: BuildAndTest
    displayName: 'Build and Test Application'
    dependsOn: CodeAnalysis
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js $(nodeVersion)'
      inputs:
        versionSpec: $(nodeVersion)
    
    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | $(workingDirectory)/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(workingDirectory)/node_modules
    
    - script: |
        cd $(workingDirectory)
        npm ci
      displayName: 'Install dependencies'
    
    # Validate Next.js configuration
    - script: |
        cd $(workingDirectory)
        echo "Validating Next.js configuration..."
        if [ ! -f "next.config.js" ]; then
          echo "ERROR: next.config.js not found"
          exit 1
        fi
        
        # Check for proper instrumentation setup (required for Datadog)
        if [ ! -f "instrumentation.ts" ]; then
          echo "WARNING: instrumentation.ts not found - Datadog monitoring may not work properly"
        fi
        
        echo "✅ Next.js configuration validated"
      displayName: 'Validate Next.js configuration'
    
    # Run tests with coverage
    - script: |
        cd $(workingDirectory)
        if [ -f "jest.config.js" ] || grep -q "\"test\":" package.json; then
          echo "Running tests with coverage reporting..."
          npm test -- --coverage --watchAll=false --coverageReporters=text-lcov --coverageReporters=html
        else
          echo "No tests configured. Creating basic smoke test..."
          # Create a basic import test for critical modules
          echo "Testing critical imports..."
          node -e "
            try {
              require('./package.json');
              console.log('✅ Package.json is valid');
              if (require('fs').existsSync('./next.config.js')) {
                require('./next.config.js');
                console.log('✅ Next.js config is valid');
              }
            } catch (e) {
              console.error('❌ Critical module test failed:', e.message);
              process.exit(1);
            }
          "
        fi
      displayName: 'Run tests and validation'
      continueOnError: false
    
    # Build with production optimizations
    - script: |
        cd $(workingDirectory)
        echo "Building application with production optimizations..."
        
        # Set build environment
        export NODE_ENV=production
        export NEXT_TELEMETRY_DISABLED=1
        
        # Run Next.js build
        npm run build
        
        # Validate build output
        if [ ! -d ".next" ]; then
          echo "ERROR: Build failed - .next directory not found"
          exit 1
        fi
        
        echo "✅ Application built successfully"
        
        # Check bundle size (warn if too large)
        if command -v du &> /dev/null; then
          build_size=$(du -sh .next | cut -f1)
          echo "Build size: $build_size"
        fi
      displayName: 'Build application with validations'
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: '1'
    
    # Create enhanced deployment package
    - script: |
        echo "Creating enhanced deployment package..."
        cd $(workingDirectory)
        
        # Create deployment package with necessary files
        mkdir -p ../deployment-package
        
        # Copy application files
        cp -r .next ../deployment-package/
        cp -r public ../deployment-package/
        cp package.json ../deployment-package/
        cp package-lock.json ../deployment-package/
        cp next.config.js ../deployment-package/
        
        # Copy instrumentation file if exists (for Datadog)
        if [ -f "instrumentation.ts" ]; then
          cp instrumentation.ts ../deployment-package/
        fi
        
        # Create startup script
        cat > ../deployment-package/startup.sh << 'EOF'
        #!/bin/bash
        echo "Starting Azure Chat application..."
        npm install --production
        npm start
        EOF
        chmod +x ../deployment-package/startup.sh
        
        echo "✅ Deployment package created"
      displayName: 'Create deployment package'
    
    # Archive application for deployment
    - task: ArchiveFiles@2
      displayName: 'Archive application files'
      inputs:
        rootFolderOrFile: 'deployment-package'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip
        replaceExistingArchive: true
        verbose: true
    
    # Publish build artifacts
    - task: PublishPipelineArtifact@1
      displayName: 'Publish build artifacts'
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: $(artifactName)
        publishLocation: 'pipeline'

  # Enhanced Infrastructure Validation
  - job: InfrastructureValidation
    displayName: 'Infrastructure Validation & Security Check'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: 'Validate Bicep templates and security'
      inputs:
        azureSubscription: $(azureServiceConnectionDev)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Installing and updating Bicep..."
          az bicep install
          az bicep upgrade
          
          echo "Validating Bicep templates..."
          
          # Validate main template
          echo "🔍 Validating main.bicep..."
          az bicep build --file $(infraDirectory)/main.bicep --outfile main-compiled.json
          
          # Validate resources template
          echo "🔍 Validating resources.bicep..."
          az bicep build --file $(infraDirectory)/resources.bicep --outfile resources-compiled.json
          
          # Enhanced linting
          echo "🔍 Running Bicep linter..."
          az bicep lint --file $(infraDirectory)/main.bicep
          az bicep lint --file $(infraDirectory)/resources.bicep
          
          # Security validation
          echo "🔒 Checking security configurations..."
          
          # Check for managed identity usage
          if grep -q "disableLocalAuth.*true" $(infraDirectory)/main.bicep; then
            echo "✅ Managed Identity authentication enabled"
          else
            echo "⚠️ WARNING: Consider enabling managed identities (disableLocalAuth: true)"
          fi
          
          # Check for private endpoints configuration
          if grep -q "usePrivateEndpoints" $(infraDirectory)/main.bicep; then
            echo "✅ Private endpoints configuration found"
          else
            echo "⚠️ WARNING: Private endpoints configuration not found"
          fi
          
          # Validate Key Vault configuration
          if grep -q "keyVault" $(infraDirectory)/resources.bicep || grep -q "Microsoft.KeyVault" $(infraDirectory)/resources.bicep; then
            echo "✅ Key Vault configuration found"
          else
            echo "❌ ERROR: Key Vault configuration required for secure secret storage"
            exit 1
          fi
          
          echo "✅ Infrastructure validation completed successfully"
    
    # Validate automation scripts
    - script: |
        echo "Validating automation scripts..."
        
        # Check PowerShell scripts
        if [ -f "$(scriptsDirectory)/setup-azure-devops.ps1" ]; then
          echo "✅ Azure DevOps setup script found"
        fi
        
        if [ -f "$(scriptsDirectory)/add_localdev_roles.ps1" ] || [ -f "$(scriptsDirectory)/add_localdev_roles.sh" ]; then
          echo "✅ Local development role assignment scripts found"
        fi
        
        if [ -f "$(scriptsDirectory)/appreg_setup.ps1" ] || [ -f "$(scriptsDirectory)/appreg_setup.sh" ]; then
          echo "✅ App registration setup scripts found"
        fi
        
        echo "📜 Script validation completed"
      displayName: 'Validate automation scripts'
    
    # Publish infrastructure artifacts
    - task: PublishPipelineArtifact@1
      displayName: 'Publish infrastructure artifacts'
      inputs:
        targetPath: $(infraDirectory)
        artifactName: infrastructure
        publishLocation: 'pipeline'
    
    # Publish scripts artifacts
    - task: PublishPipelineArtifact@1
      displayName: 'Publish scripts artifacts'
      inputs:
        targetPath: $(scriptsDirectory)
        artifactName: scripts
        publishLocation: 'pipeline'

# ==================================================
# DEVELOPMENT DEPLOYMENT STAGE
# ==================================================
- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn: CI
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  variables:
    - group: 'azurechat-dev'
    - name: environmentName
      value: 'dev'
    - name: resourceGroupName
      value: 'rg-azurechat-dev'
    - name: usePrivateEndpoints
      value: 'false'
    - name: enableDatadogMonitoring
      value: 'false'
  jobs:
  
  # Enhanced Infrastructure Deployment
  - deployment: InfrastructureDev
    displayName: 'Deploy Infrastructure - Dev'
    pool:
      vmImage: $(vmImageName)
    environment: 'azurechat-dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download infrastructure artifacts'
            inputs:
              artifact: infrastructure
              path: '$(Pipeline.Workspace)/infrastructure'
          
          - task: DownloadPipelineArtifact@2
            displayName: 'Download scripts artifacts'
            inputs:
              artifact: scripts
              path: '$(Pipeline.Workspace)/scripts'
          
          - task: AzureCLI@2
            displayName: 'Deploy Azure infrastructure with enhanced features'
            inputs:
              azureSubscription: $(azureServiceConnectionDev)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "🚀 Deploying infrastructure to Development environment..."
                echo "Environment: $(ENVIRONMENT_NAME)"
                echo "Resource Group: $(RESOURCE_GROUP_NAME)"
                echo "Location: $(AZURE_LOCATION)"
                echo "Private Endpoints: $(USE_PRIVATE_ENDPOINTS)"
                echo "Managed Identities: $(ENABLE_MANAGED_IDENTITIES)"
                
                # Set deployment variables
                DEPLOYMENT_NAME="azurechat-infra-$(Build.BuildId)"
                
                # Deploy main bicep template with all documented parameters
                echo "📋 Deploying main Bicep template..."
                az deployment sub create \
                  --name "$DEPLOYMENT_NAME" \
                  --location "$(AZURE_LOCATION)" \
                  --template-file "$(Pipeline.Workspace)/infrastructure/main.bicep" \
                  --parameters \
                    name="$(ENVIRONMENT_NAME)" \
                    location="$(AZURE_LOCATION)" \
                    openAILocation="$(OPENAI_LOCATION)" \
                    dalleLocation="$(DALLE_LOCATION)" \
                    disableLocalAuth="$(ENABLE_MANAGED_IDENTITIES)" \
                    usePrivateEndpoints="$(USE_PRIVATE_ENDPOINTS)" \
                    resourceGroupName="$(RESOURCE_GROUP_NAME)" \
                    openAISku="S0" \
                    searchServiceSkuName="basic" \
                    formRecognizerSkuName="S0" \
                    chatGptDeploymentName="$(OPENAI_DEPLOYMENT_NAME)" \
                    chatGptModelName="$(OPENAI_MODEL_NAME)" \
                    embeddingDeploymentName="$(OPENAI_EMBEDDINGS_DEPLOYMENT_NAME)" \
                    dalleDeploymentName="$(OPENAI_DALLE_DEPLOYMENT_NAME)"
                
                # Check deployment status
                if [ $? -eq 0 ]; then
                  echo "✅ Infrastructure deployment successful"
                else
                  echo "❌ Infrastructure deployment failed"
                  exit 1
                fi
                
                # Capture and display outputs
                echo "📊 Capturing deployment outputs..."
                az deployment sub show \
                  --name "$DEPLOYMENT_NAME" \
                  --query "properties.outputs" \
                  --output json > deployment-outputs.json
                
                echo "🔍 Deployment outputs:"
                cat deployment-outputs.json | jq '.'
                
                # Extract key outputs for application configuration
                APP_URL=$(cat deployment-outputs.json | jq -r '.APP_URL.value // empty')
                WEBAPP_NAME=$(cat deployment-outputs.json | jq -r '.AZURE_WEBAPP_NAME.value // empty')
                KEY_VAULT_NAME=$(cat deployment-outputs.json | jq -r '.AZURE_KEY_VAULT_NAME.value // empty')
                
                echo "🌐 Application URL: $APP_URL"
                echo "🖥️ Web App Name: $WEBAPP_NAME"
                echo "🔐 Key Vault Name: $KEY_VAULT_NAME"
                
                # Store outputs for next job
                echo "##vso[task.setvariable variable=deployedAppUrl;isOutput=true]$APP_URL"
                echo "##vso[task.setvariable variable=deployedWebAppName;isOutput=true]$WEBAPP_NAME"
                echo "##vso[task.setvariable variable=deployedKeyVaultName;isOutput=true]$KEY_VAULT_NAME"
            name: deployInfra
            env:
              ENVIRONMENT_NAME: $(environmentName)
              RESOURCE_GROUP_NAME: $(resourceGroupName)
              AZURE_LOCATION: $(AZURE_LOCATION)
              OPENAI_LOCATION: $(OPENAI_LOCATION)
              DALLE_LOCATION: $(DALLE_LOCATION)
              USE_PRIVATE_ENDPOINTS: $(usePrivateEndpoints)
              ENABLE_MANAGED_IDENTITIES: $(enableManagedIdentities)
              OPENAI_DEPLOYMENT_NAME: $(OPENAI_DEPLOYMENT_NAME)
              OPENAI_MODEL_NAME: $(OPENAI_MODEL_NAME)
              OPENAI_EMBEDDINGS_DEPLOYMENT_NAME: $(OPENAI_EMBEDDINGS_DEPLOYMENT_NAME)
              OPENAI_DALLE_DEPLOYMENT_NAME: $(OPENAI_DALLE_DEPLOYMENT_NAME)

  # Enhanced Application Deployment with Feature Configuration
  - deployment: ApplicationDev
    displayName: 'Deploy Application - Dev'
    dependsOn: InfrastructureDev
    pool:
      vmImage: $(vmImageName)
    environment: 'azurechat-dev'
    variables:
      deployedWebAppName: $[ dependencies.InfrastructureDev.outputs['deployInfra.deployedWebAppName'] ]
      deployedKeyVaultName: $[ dependencies.InfrastructureDev.outputs['deployInfra.deployedKeyVaultName'] ]
      deployedAppUrl: $[ dependencies.InfrastructureDev.outputs['deployInfra.deployedAppUrl'] ]
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download application artifacts'
            inputs:
              artifact: $(artifactName)
              path: '$(Pipeline.Workspace)/$(artifactName)'
          
          - task: AzureKeyVault@2
            displayName: 'Retrieve secrets from Key Vault'
            inputs:
              azureSubscription: $(azureServiceConnectionDev)
              KeyVaultName: '$(deployedKeyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: false
          
          # Configure comprehensive application settings
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App with full configuration'
            inputs:
              azureSubscription: $(azureServiceConnectionDev)
              appType: webAppLinux
              appName: '$(deployedWebAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName)-$(Build.BuildId).zip'
              runtimeStack: 'NODE|22-lts'
              startUpCommand: 'npm start'
              appSettings: |
                -WEBSITES_NODE_DEFAULT_VERSION ~22
                -USE_MANAGED_IDENTITIES $(enableManagedIdentities)
                -NEXTAUTH_URL $(deployedAppUrl)
                -NEXTAUTH_SECRET $(nextauth-secret)
                -ADMIN_EMAIL_ADDRESS $(ADMIN_EMAIL_ADDRESS_DEV)
                -AZURE_COSMOSDB_URI $(cosmos-uri)
                -AZURE_COSMOSDB_DB_NAME $(COSMOS_DB_NAME)
                -AZURE_COSMOSDB_CONTAINER_NAME $(COSMOS_CONTAINER_NAME)
                -AZURE_COSMOSDB_CONFIG_CONTAINER_NAME $(COSMOS_CONFIG_CONTAINER_NAME)
                -AZURE_OPENAI_API_INSTANCE_NAME $(OPENAI_INSTANCE_NAME_DEV)
                -AZURE_OPENAI_API_DEPLOYMENT_NAME $(OPENAI_DEPLOYMENT_NAME)
                -AZURE_OPENAI_API_VERSION $(OPENAI_API_VERSION)
                -AZURE_OPENAI_API_EMBEDDINGS_DEPLOYMENT_NAME $(OPENAI_EMBEDDINGS_DEPLOYMENT_NAME)
                -AZURE_OPENAI_DALLE_API_INSTANCE_NAME $(OPENAI_DALLE_INSTANCE_NAME_DEV)
                -AZURE_OPENAI_DALLE_API_DEPLOYMENT_NAME $(OPENAI_DALLE_DEPLOYMENT_NAME)
                -AZURE_OPENAI_DALLE_API_VERSION $(OPENAI_DALLE_API_VERSION)
                -AZURE_SEARCH_NAME $(SEARCH_SERVICE_NAME_DEV)
                -AZURE_SEARCH_INDEX_NAME $(SEARCH_INDEX_NAME)
                -AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT $(DOCUMENT_INTELLIGENCE_ENDPOINT_DEV)
                -AZURE_SPEECH_REGION $(SPEECH_REGION)
                -AZURE_STORAGE_ACCOUNT_NAME $(STORAGE_ACCOUNT_NAME_DEV)
                -AZURE_KEY_VAULT_NAME $(deployedKeyVaultName)
                -MAX_UPLOAD_DOCUMENT_SIZE 20000000
                -DEBUG false
          
          # Configure Datadog monitoring if enabled
          - task: AzureCLI@2
            displayName: 'Configure Datadog monitoring (if enabled)'
            condition: eq(variables['enableDatadogMonitoring'], 'true')
            inputs:
              azureSubscription: $(azureServiceConnectionDev)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "🐕 Configuring Datadog monitoring for development..."
                
                # Add Datadog-specific app settings
                az webapp config appsettings set \
                  --name "$(deployedWebAppName)" \
                  --resource-group "$(resourceGroupName)" \
                  --settings \
                    DD_API_KEY="$(datadog-api-key)" \
                    DD_SITE="$(DATADOG_SITE)" \
                    DD_SERVICE="azurechat" \
                    DD_ENV="development" \
                    DD_VERSION="$(Build.BuildNumber)" \
                    DD_TRACE_ENABLED="false" \
                    DD_LOGS_INJECTION="true" \
                    DD_RUNTIME_METRICS_ENABLED="false" \
                    NEXT_PUBLIC_DD_APPLICATION_ID="$(datadog-rum-app-id)" \
                    NEXT_PUBLIC_DD_CLIENT_TOKEN="$(datadog-rum-client-token)" \
                    NEXT_PUBLIC_DD_SITE="$(DATADOG_SITE)" \
                    NEXT_PUBLIC_DD_ENV="development"
                
                echo "✅ Datadog monitoring configured"
          
          # Enhanced health checks with feature validation
          - task: PowerShell@2
            displayName: 'Comprehensive application health check'
            inputs:
              targetType: 'inline'
              script: |
                $uri = "$(deployedAppUrl)"
                Write-Host "🏥 Performing comprehensive health check on: $uri"
                
                # Test basic connectivity
                $healthCheckPassed = $false
                for ($i = 1; $i -le 10; $i++) {
                    try {
                        Write-Host "Attempt $i of 10..."
                        $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 30
                        if ($response.StatusCode -eq 200) {
                            Write-Host "✅ Basic health check passed (attempt $i)"
                            $healthCheckPassed = $true
                            break
                        }
                    }
                    catch {
                        Write-Host "⚠️ Health check failed (attempt $i): $($_.Exception.Message)"
                        if ($i -lt 10) { Start-Sleep -Seconds 30 }
                    }
                }
                
                if (-not $healthCheckPassed) {
                    Write-Error "❌ Basic health check failed after 10 attempts"
                    exit 1
                }
                
                # Test API endpoints if accessible
                Write-Host "🔍 Testing API endpoints..."
                $apiTests = @(
                    "/api/auth/providers",
                    "/api/health"
                )
                
                foreach ($endpoint in $apiTests) {
                    try {
                        $apiUri = "$uri$endpoint"
                        $apiResponse = Invoke-WebRequest -Uri $apiUri -UseBasicParsing -TimeoutSec 15
                        Write-Host "✅ API endpoint $endpoint: Status $($apiResponse.StatusCode)"
                    }
                    catch {
                        Write-Host "⚠️ API endpoint $endpoint not accessible or returned error"
                    }
                }
                
                Write-Host "🎉 Development deployment health check completed successfully!"

# ==================================================
# PRODUCTION DEPLOYMENT STAGE
# ==================================================
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: DeployDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    - group: 'azurechat-prod'
    - name: environmentName
      value: 'prod'
    - name: resourceGroupName
      value: 'rg-azurechat-prod'
    - name: usePrivateEndpoints
      value: 'true'
    - name: enableDatadogMonitoring
      value: 'true'
  jobs:
  
  # Production Deployment with Enterprise Features
  - deployment: ProductionDeployment
    displayName: 'Production Deployment with Enterprise Features'
    pool:
      vmImage: $(vmImageName)
    environment: 'azurechat-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          # Download all artifacts
          - task: DownloadPipelineArtifact@2
            displayName: 'Download application artifacts'
            inputs:
              artifact: $(artifactName)
              path: '$(Pipeline.Workspace)/$(artifactName)'
          
          - task: DownloadPipelineArtifact@2
            displayName: 'Download infrastructure artifacts'
            inputs:
              artifact: infrastructure
              path: '$(Pipeline.Workspace)/infrastructure'
          
          # Deploy production infrastructure with enterprise settings
          - task: AzureCLI@2
            displayName: 'Deploy production infrastructure'
            inputs:
              azureSubscription: $(azureServiceConnectionProd)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "🚀 Deploying production infrastructure with enterprise features..."
                
                DEPLOYMENT_NAME="azurechat-prod-$(Build.BuildId)"
                
                # Deploy with production-grade settings
                az deployment sub create \
                  --name "$DEPLOYMENT_NAME" \
                  --location "$(AZURE_LOCATION)" \
                  --template-file "$(Pipeline.Workspace)/infrastructure/main.bicep" \
                  --parameters \
                    name="$(ENVIRONMENT_NAME)" \
                    location="$(AZURE_LOCATION)" \
                    openAILocation="$(OPENAI_LOCATION)" \
                    dalleLocation="$(DALLE_LOCATION)" \
                    disableLocalAuth=true \
                    usePrivateEndpoints="$(USE_PRIVATE_ENDPOINTS)" \
                    resourceGroupName="$(RESOURCE_GROUP_NAME)" \
                    openAISku="S0" \
                    searchServiceSkuName="standard2" \
                    formRecognizerSkuName="S0" \
                    chatGptDeploymentCapacity=50 \
                    embeddingDeploymentCapacity=120 \
                    dalleDeploymentCapacity=2
                
                # Capture outputs
                az deployment sub show \
                  --name "$DEPLOYMENT_NAME" \
                  --query "properties.outputs" \
                  --output json > prod-outputs.json
                
                # Extract production values
                PROD_APP_URL=$(cat prod-outputs.json | jq -r '.APP_URL.value')
                PROD_WEBAPP_NAME=$(cat prod-outputs.json | jq -r '.AZURE_WEBAPP_NAME.value')
                PROD_KEY_VAULT_NAME=$(cat prod-outputs.json | jq -r '.AZURE_KEY_VAULT_NAME.value')
                
                echo "##vso[task.setvariable variable=prodAppUrl;isOutput=true]$PROD_APP_URL"
                echo "##vso[task.setvariable variable=prodWebAppName;isOutput=true]$PROD_WEBAPP_NAME"
                echo "##vso[task.setvariable variable=prodKeyVaultName;isOutput=true]$PROD_KEY_VAULT_NAME"
                
                echo "🏭 Production infrastructure deployed successfully"
            name: deployProdInfra
            env:
              ENVIRONMENT_NAME: $(environmentName)
              RESOURCE_GROUP_NAME: $(resourceGroupName)
              AZURE_LOCATION: $(AZURE_LOCATION)
              OPENAI_LOCATION: $(OPENAI_LOCATION)
              DALLE_LOCATION: $(DALLE_LOCATION)
              USE_PRIVATE_ENDPOINTS: $(usePrivateEndpoints)
          
          # Retrieve production secrets
          - task: AzureKeyVault@2
            displayName: 'Retrieve production secrets'
            inputs:
              azureSubscription: $(azureServiceConnectionProd)
              KeyVaultName: '$(prodKeyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: false
            variables:
              prodKeyVaultName: $[ dependencies.ProductionDeployment.outputs['deployProdInfra.prodKeyVaultName'] ]
          
          # Blue-Green deployment to staging slot
          - task: AzureWebApp@1
            displayName: 'Deploy to production staging slot'
            inputs:
              azureSubscription: $(azureServiceConnectionProd)
              appType: webAppLinux
              appName: '$(prodWebAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName)-$(Build.BuildId).zip'
              runtimeStack: 'NODE|22-lts'
              startUpCommand: 'npm start'
              deployToSlotOrASE: true
              slotName: 'staging'
              appSettings: |
                -WEBSITES_NODE_DEFAULT_VERSION ~22
                -USE_MANAGED_IDENTITIES true
                -NEXTAUTH_URL https://$(prodWebAppName)-staging.azurewebsites.net
                -NEXTAUTH_SECRET $(nextauth-secret)
                -ADMIN_EMAIL_ADDRESS $(ADMIN_EMAIL_ADDRESS_PROD)
                -AZURE_COSMOSDB_URI $(cosmos-uri)
                -AZURE_COSMOSDB_DB_NAME $(COSMOS_DB_NAME)
                -AZURE_COSMOSDB_CONTAINER_NAME $(COSMOS_CONTAINER_NAME)
                -AZURE_COSMOSDB_CONFIG_CONTAINER_NAME $(COSMOS_CONFIG_CONTAINER_NAME)
                -AZURE_OPENAI_API_INSTANCE_NAME $(OPENAI_INSTANCE_NAME_PROD)
                -AZURE_OPENAI_API_DEPLOYMENT_NAME $(OPENAI_DEPLOYMENT_NAME)
                -AZURE_OPENAI_API_VERSION $(OPENAI_API_VERSION)
                -AZURE_OPENAI_API_EMBEDDINGS_DEPLOYMENT_NAME $(OPENAI_EMBEDDINGS_DEPLOYMENT_NAME)
                -AZURE_OPENAI_DALLE_API_INSTANCE_NAME $(OPENAI_DALLE_INSTANCE_NAME_PROD)
                -AZURE_OPENAI_DALLE_API_DEPLOYMENT_NAME $(OPENAI_DALLE_DEPLOYMENT_NAME)
                -AZURE_OPENAI_DALLE_API_VERSION $(OPENAI_DALLE_API_VERSION)
                -AZURE_SEARCH_NAME $(SEARCH_SERVICE_NAME_PROD)
                -AZURE_SEARCH_INDEX_NAME $(SEARCH_INDEX_NAME)
                -AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT $(DOCUMENT_INTELLIGENCE_ENDPOINT_PROD)
                -AZURE_SPEECH_REGION $(SPEECH_REGION)
                -AZURE_STORAGE_ACCOUNT_NAME $(STORAGE_ACCOUNT_NAME_PROD)
                -AZURE_KEY_VAULT_NAME $(prodKeyVaultName)
                -MAX_UPLOAD_DOCUMENT_SIZE 20000000
                -DD_API_KEY $(datadog-api-key)
                -DD_SITE $(DATADOG_SITE)
                -DD_SERVICE azurechat
                -DD_ENV production
                -DD_VERSION $(Build.BuildNumber)
                -DD_TRACE_ENABLED true
                -DD_LOGS_INJECTION true
                -DD_RUNTIME_METRICS_ENABLED true
                -DD_PROFILING_ENABLED true
                -NEXT_PUBLIC_DD_APPLICATION_ID $(datadog-rum-app-id)
                -NEXT_PUBLIC_DD_CLIENT_TOKEN $(datadog-rum-client-token)
                -NEXT_PUBLIC_DD_SITE $(DATADOG_SITE)
                -NEXT_PUBLIC_DD_ENV production
                -DEBUG false
            variables:
              prodWebAppName: $[ dependencies.ProductionDeployment.outputs['deployProdInfra.prodWebAppName'] ]
              prodKeyVaultName: $[ dependencies.ProductionDeployment.outputs['deployProdInfra.prodKeyVaultName'] ]
          
          # Comprehensive staging validation
          - task: PowerShell@2
            displayName: 'Comprehensive staging validation'
            inputs:
              targetType: 'inline'
              script: |
                $stagingUri = "https://$(prodWebAppName)-staging.azurewebsites.net"
                Write-Host "🧪 Performing comprehensive staging validation: $stagingUri"
                
                # Extended staging validation with all features
                $validationTests = @{
                    "Basic Connectivity" = $stagingUri
                    "Authentication Providers" = "$stagingUri/api/auth/providers"
                    "Health Check" = "$stagingUri/api/health"
                }
                
                foreach ($testName in $validationTests.Keys) {
                    $testUri = $validationTests[$testName]
                    Write-Host "Testing: $testName"
                    
                    for ($i = 1; $i -le 5; $i++) {
                        try {
                            $response = Invoke-WebRequest -Uri $testUri -UseBasicParsing -TimeoutSec 30
                            if ($response.StatusCode -eq 200) {
                                Write-Host "✅ $testName passed"
                                break
                            }
                        }
                        catch {
                            Write-Host "⚠️ $testName failed (attempt $i): $($_.Exception.Message)"
                            if ($i -eq 5) {
                                Write-Error "❌ $testName failed after 5 attempts"
                                exit 1
                            }
                            Start-Sleep -Seconds 30
                        }
                    }
                }
                
                Write-Host "🎯 All staging validation tests passed!"
            variables:
              prodWebAppName: $[ dependencies.ProductionDeployment.outputs['deployProdInfra.prodWebAppName'] ]
          
          # Production slot swap
          - task: AzureCLI@2
            displayName: 'Swap to production with monitoring'
            inputs:
              azureSubscription: $(azureServiceConnectionProd)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "🔄 Swapping staging to production..."
                
                # Perform the swap
                az webapp deployment slot swap \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(prodWebAppName)" \
                  --slot "staging" \
                  --target-slot "production"
                
                if [ $? -eq 0 ]; then
                  echo "✅ Slot swap completed successfully"
                else
                  echo "❌ Slot swap failed"
                  exit 1
                fi
                
                echo "🚀 Production deployment completed!"
            variables:
              prodWebAppName: $[ dependencies.ProductionDeployment.outputs['deployProdInfra.prodWebAppName'] ]
          
          # Final production validation
          - task: PowerShell@2
            displayName: 'Production validation with monitoring'
            inputs:
              targetType: 'inline'
              script: |
                $prodUri = "$(prodAppUrl)"
                Write-Host "🏭 Final production validation: $prodUri"
                
                # Production validation with enhanced monitoring
                $success = $false
                for ($i = 1; $i -le 10; $i++) {
                    try {
                        $response = Invoke-WebRequest -Uri $prodUri -UseBasicParsing -TimeoutSec 30
                        if ($response.StatusCode -eq 200) {
                            Write-Host "✅ Production validation passed (attempt $i)"
                            $success = $true
                            break
                        }
                    }
                    catch {
                        Write-Host "⚠️ Production validation failed (attempt $i): $($_.Exception.Message)"
                        if ($i -lt 10) { Start-Sleep -Seconds 30 }
                    }
                }
                
                if (-not $success) {
                    Write-Error "❌ Production validation failed - initiating rollback"
                    # Trigger rollback
                    exit 1
                }
                
                Write-Host "🎉 Production deployment completed successfully!"
                Write-Host "🌐 Application URL: $prodUri"
                Write-Host "📊 Monitor application at Datadog dashboard"
                Write-Host "🔐 Secrets managed via Azure Key Vault"
                Write-Host "🛡️ Security: Managed identities enabled, private endpoints configured"
            variables:
              prodAppUrl: $[ dependencies.ProductionDeployment.outputs['deployProdInfra.prodAppUrl'] ]

# ==================================================
# POST-DEPLOYMENT VALIDATION & MONITORING
# ==================================================
- stage: PostDeployment
  displayName: 'Post-Deployment Validation & Monitoring Setup'
  dependsOn: DeployProd
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: SetupMonitoringAndAlerts
    displayName: 'Setup Comprehensive Monitoring & Alerts'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: 'Configure Application Insights and alerts'
      inputs:
        azureSubscription: $(azureServiceConnectionProd)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "📊 Setting up Application Insights monitoring..."
          
          # Configure Application Insights alerts
          echo "🚨 Setting up critical alerts..."
          
          # High error rate alert
          az monitor metrics alert create \
            --name "Azure Chat - High Error Rate" \
            --resource-group "$(resourceGroupName)" \
            --scopes "/subscriptions/$(SUBSCRIPTION_ID)/resourceGroups/$(resourceGroupName)/providers/Microsoft.Web/sites/$(WEBAPP_NAME_PROD)" \
            --condition "avg requests/failed > 5" \
            --window-size 5m \
            --evaluation-frequency 1m \
            --severity 2 \
            --description "High error rate detected in Azure Chat production"
          
          echo "✅ Monitoring and alerts configured"
    
    - task: PowerShell@2
      displayName: 'Deployment completion summary'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🎉 Azure Chat deployment completed successfully!"
          Write-Host ""
          Write-Host "📊 Deployment Summary:"
          Write-Host "  ✅ Infrastructure: Deployed with Bicep IaC"
          Write-Host "  ✅ Application: Next.js 22 with TypeScript"
          Write-Host "  ✅ Security: Managed identities enabled"
          Write-Host "  ✅ Secrets: Azure Key Vault integration"
          Write-Host "  ✅ Monitoring: Datadog APM and RUM enabled"
          Write-Host "  ✅ Deployment: Blue-green strategy implemented"
          Write-Host "  ✅ Features: All documented capabilities enabled"
          Write-Host ""
          Write-Host "🌐 Production URL: $(WEBAPP_NAME_PROD).azurewebsites.net"
          Write-Host "🔐 Admin Access: Configure via ADMIN_EMAIL_ADDRESS"
          Write-Host "📚 Documentation: /docs folder for feature guides"
          Write-Host "🐕 Monitoring: Datadog dashboard available"
          Write-Host ""
          Write-Host "🚀 Azure Chat is now live with enterprise features!"